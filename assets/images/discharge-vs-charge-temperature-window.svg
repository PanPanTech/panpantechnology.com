<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Schematic comparing the discharge temperature window quoted on datasheets with the much narrower charging temperature window that is usually omitted">
  <rect width="1000" height="470" fill="#f5f6f8"/>
  <text x="48" y="38" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#9aa3b5" letter-spacing="2.4">TWO DIFFERENT NUMBERS — ONLY ONE OF THEM IS USUALLY ON THE DATASHEET</text>

  <!-- axis -->
  <line x1="150" y1="300" x2="936" y2="300" stroke="#c9cfda" stroke-width="1.5"/>
  <g font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#9aa3b5">
    <text x="150" y="322">−30 °C</text><text x="270" y="322">−20</text><text x="390" y="322">−10</text>
    <text x="505" y="322">0</text><text x="620" y="322">+10</text><text x="740" y="322">+25</text><text x="860" y="322">+45</text>
  </g>
  <line x1="512" y1="96" x2="512" y2="312" stroke="#c8781f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="520" y="92" font-family="Instrument Sans, sans-serif" font-size="12.5" fill="#c8781f" font-weight="600">0 °C</text>

  <!-- discharge bar -->
  <text x="48" y="150" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#0b0f1a">Discharge</text>
  <text x="48" y="169" font-family="Instrument Sans, sans-serif" font-size="12" fill="#9aa3b5">"operating temp"</text>
  <rect x="270" y="132" width="666" height="40" rx="6" fill="#0e5fd9" opacity="0.82"/>
  <text x="290" y="157" font-family="Instrument Sans, sans-serif" font-size="13.5" fill="#fff">the range a datasheet normally quotes — the machine will run</text>

  <!-- charge bar -->
  <text x="48" y="228" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#0b0f1a">Charge</text>
  <text x="48" y="247" font-family="Instrument Sans, sans-serif" font-size="12" fill="#c8781f">usually omitted</text>
  <rect x="270" y="210" width="242" height="40" rx="6" fill="#e3e7ee" stroke="#c8781f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="300" y="235" font-family="Instrument Sans, sans-serif" font-size="13" fill="#c8781f">charging restricted or blocked</text>
  <rect x="512" y="210" width="424" height="40" rx="6" fill="#2f6b3f" opacity="0.75"/>
  <text x="534" y="235" font-family="Instrument Sans, sans-serif" font-size="13.5" fill="#fff">commonly quoted charge window for LFP and NMC cells</text>

  <!-- the gap -->
  <path d="M270 268 L512 268" stroke="#c8781f" stroke-width="1.6"/>
  <path d="M270 262 L270 274 M512 262 L512 274" stroke="#c8781f" stroke-width="1.6"/>
  <text x="391" y="288" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="12.5" fill="#c8781f" font-weight="600">the gap nobody quotes</text>

  <rect x="48" y="346" width="904" height="62" rx="9" fill="#fff" stroke="#e3e7ee" stroke-width="1.5"/>
  <text x="76" y="374" font-family="Instrument Sans, sans-serif" font-size="14.5" fill="#3d4453">In this band the robot still drives, still sweeps, and still returns to its dock — and then does not charge. Auto-recharge is</text>
  <text x="76" y="396" font-family="Instrument Sans, sans-serif" font-size="14.5" fill="#3d4453">the capability that fails first, and it is the capability the whole unattended operating model is built on.</text>

  <text x="48" y="440" font-family="Instrument Sans, sans-serif" font-size="11.5" fill="#9aa3b5">Illustrative schematic, not measured data. Actual windows are cell- and pack-specific; a heated pack or a different chemistry shifts the charge bar left. Always request both figures for the specific machine.</text>
</svg>
