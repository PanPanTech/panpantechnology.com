<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="How to tell a real electronic shelf label manufacturer from a trading company reselling another factory's products">
  <rect width="1000" height="430" rx="0" fill="#f5f6f8"/>
  <text x="48" y="40" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9aa3b5" letter-spacing="3">TRADING COMPANY vs REAL MANUFACTURER</text>

  <rect x="70" y="78" width="395" height="288" rx="10" fill="#fff" stroke="#c25b2e" stroke-width="2"/>
  <text x="267.5" y="113" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#c25b2e">Trading company</text>
  <text x="267.5" y="137" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="14" fill="#8a4b34">(re-badges another factory)</text>
  <g font-family="Instrument Sans, sans-serif" font-size="15" fill="#2f3747">
    <text x="100" y="176">✕ No SMT line or test lab of its own</text>
    <text x="100" y="207">✕ Certificate holder is another entity</text>
    <text x="100" y="238">✕ Cannot show incoming panel spec</text>
    <text x="100" y="269">✕ Firmware belongs to a third party</text>
    <text x="100" y="300">✕ Generic or borrowed factory photos</text>
    <text x="100" y="331">✕ Price first, questions deflected</text>
  </g>

  <rect x="535" y="78" width="395" height="288" rx="10" fill="#fff" stroke="#2f6b3f" stroke-width="2"/>
  <text x="732.5" y="113" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#2f6b3f">Real manufacturer</text>
  <text x="732.5" y="137" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="14" fill="#416e4b">(controls the process)</text>
  <g font-family="Instrument Sans, sans-serif" font-size="15" fill="#2f3747">
    <text x="565" y="176">✓ Owns SMT, AOI/X-ray, aging and RF test</text>
    <text x="565" y="207">✓ Holds CE/FCC/UN 38.3 documents</text>
    <text x="565" y="238">✓ Shows incoming panel acceptance spec</text>
    <text x="565" y="269">✓ Owns or co-develops firmware</text>
    <text x="565" y="300">✓ Named auditable factory and labs</text>
    <text x="565" y="331">✓ Written BOM change-control process</text>
  </g>

  <text x="500" y="404" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="15" fill="#3d4453">Fastest test: certificate holder + incoming panel acceptance specification.</text>
</svg>
