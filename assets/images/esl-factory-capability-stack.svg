<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="The capability stack of a top-tier electronics factory an ESL buyer should audit: SMT and inspection, functional and RF test, reliability lab, battery and assembly, quality system and certifications">
  <rect width="1000" height="640" fill="#f5f6f8"/>
  <text x="48" y="42" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9aa3b5" letter-spacing="3">WHAT TO AUDIT — A TOP-TIER FACTORY CAPABILITY STACK</text>

  <g font-family="Instrument Sans, sans-serif">
    <rect x="70" y="70" width="860" height="84" rx="8" fill="#dbe6f7" stroke="#0e5fd9" stroke-width="1.8"/>
    <text x="96" y="101" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">1 · SMT &amp; inspection</text>
    <text x="96" y="126" font-size="14" fill="#3d4453">10-zone profiled reflow · 100% 3D SPI · MES anti-mixing traceability</text>
    <text x="96" y="145" font-size="14" fill="#3d4453">AOI to IPC-A-610 · X-ray for hidden joints</text>

    <rect x="70" y="170" width="860" height="84" rx="8" fill="#dbe6f7" stroke="#0e5fd9" stroke-width="1.8"/>
    <text x="96" y="201" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">2 · Functional &amp; RF test</text>
    <text x="96" y="226" font-size="14" fill="#3d4453">Per-unit FCT · boot current · module voltages · RSSI / MAC / hardware read</text>
    <text x="96" y="245" font-size="14" fill="#3d4453">Shield-box Wi-Fi/BLE Tx power · VNA antenna match · standby power monitor</text>

    <rect x="70" y="270" width="860" height="84" rx="8" fill="#e6f0e6" stroke="#2f6b3f" stroke-width="1.8"/>
    <text x="96" y="301" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">3 · Reliability lab</text>
    <text x="96" y="326" font-size="14" fill="#3d4453">Temperature-humidity (-60 to 150°C) · salt spray · drop and vibration</text>
    <text x="96" y="345" font-size="14" fill="#3d4453">ESD / surge · alcohol-rubber abrasion · transport simulation</text>

    <rect x="70" y="370" width="860" height="84" rx="8" fill="#e6f0e6" stroke="#2f6b3f" stroke-width="1.8"/>
    <text x="96" y="401" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">4 · Battery &amp; assembly</text>
    <text x="96" y="426" font-size="14" fill="#3d4453">In-house cell / pack line · pack ATE + aging · protection-board test</text>
    <text x="96" y="445" font-size="14" fill="#3d4453">IP-rated airtight test · UN 38.3 documentation</text>

    <rect x="70" y="470" width="860" height="92" rx="8" fill="#f0eee6" stroke="#8a7a3a" stroke-width="1.8"/>
    <text x="96" y="501" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">5 · Quality system &amp; certifications</text>
    <text x="96" y="526" font-size="14" fill="#3d4453">ISO 9001 · ISO 14001 · IATF 16949 discipline · IQC/PQC/NPI/Lab-QC</text>
    <text x="96" y="545" font-size="14" fill="#3d4453">QA/SQE/DQE · accredited lab · UL/ETL/CSA/PSE/KC · retailer audits</text>
  </g>

  <text x="500" y="615" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="15" fill="#3d4453">Real control shows at every layer, not only in the certificate folder.</text>
</svg>
