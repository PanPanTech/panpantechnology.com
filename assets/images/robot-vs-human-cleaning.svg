<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="What commercial cleaning robots can do today versus what still needs a human cleaner in 2026">
  <rect width="1000" height="470" fill="#f5f6f8"/>
  <text x="48" y="42" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9aa3b5" letter-spacing="3">2026 — WHAT A ROBOT DOES vs WHAT STILL NEEDS A HUMAN</text>

  <!-- robot column -->
  <rect x="60" y="72" width="420" height="330" rx="10" fill="#fff" stroke="#0e5fd9" stroke-width="2"/>
  <text x="270" y="108" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#0e5fd9">Robots do this well today</text>
  <text x="270" y="133" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">repetitive, large, predictable</text>
  <g font-family="Instrument Sans, sans-serif" font-size="15.5" fill="#2f3747">
    <text x="88" y="172">✓ Scrubbing large open hard floors</text>
    <text x="88" y="204">✓ Vacuuming corridors, aisles, offices</text>
    <text x="88" y="236">✓ Sweeping warehouses and yards</text>
    <text x="88" y="268">✓ Nightly lights-out routes, unattended</text>
    <text x="88" y="300">✓ The same coverage every run, logged</text>
    <text x="88" y="332">✓ Facade / window robots on glass</text>
    <text x="88" y="364">✓ Freeing staff from the repetitive share</text>
  </g>

  <!-- human column -->
  <rect x="520" y="72" width="420" height="330" rx="10" fill="#fff" stroke="#2f6b3f" stroke-width="2"/>
  <text x="730" y="108" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#2f6b3f">Still needs a human</text>
  <text x="730" y="133" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">edges, detail, judgement, exceptions</text>
  <g font-family="Instrument Sans, sans-serif" font-size="15.5" fill="#2f3747">
    <text x="548" y="172">• Corners, edges, skirting, tight spaces</text>
    <text x="548" y="204">• Stairs and multi-level transitions</text>
    <text x="548" y="236">• Restrooms, touchpoints, detail wiping</text>
    <text x="548" y="268">• Spills and one-off exceptions</text>
    <text x="548" y="300">• Cluttered, changing environments</text>
    <text x="548" y="332">• Guest-facing judgement and service</text>
    <text x="548" y="364">• Deciding what "clean enough" means</text>
  </g>

  <text x="500" y="440" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="15" fill="#3d4453">The realistic 2026 outcome is not replacement — it is redeployment: the robot takes the floor, people move up to the work it can't do.</text>
</svg>
