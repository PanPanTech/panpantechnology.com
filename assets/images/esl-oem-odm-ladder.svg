<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="The ESL sourcing ladder: stock white-label, platform ODM and full OEM tooling, with the minimum order quantity and lead time each step requires">
  <rect width="1000" height="520" fill="#f5f6f8"/>
  <text x="48" y="40" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#9aa3b5" letter-spacing="2.6">THE ESL SOURCING LADDER — WHAT EACH STEP ACTUALLY BUYS YOU</text>

  <!-- step 1 -->
  <rect x="56" y="330" width="272" height="140" rx="9" fill="#fff" stroke="#9aa3b5" stroke-width="2"/>
  <text x="76" y="360" font-family="IBM Plex Mono, monospace" font-size="12" fill="#6a7386">STEP 1</text>
  <text x="76" y="386" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">Stock / white-label</text>
  <text x="76" y="410" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">Our model, our brand, on your shelf</text>
  <text x="76" y="435" font-family="IBM Plex Mono, monospace" font-size="13" fill="#0e5fd9">MOQ 100 pcs · 3–7 days</text>
  <text x="76" y="456" font-family="Instrument Sans, sans-serif" font-size="13" fill="#6a7386">100% payment in advance</text>

  <!-- step 2 -->
  <rect x="364" y="212" width="272" height="258" rx="9" fill="#fff" stroke="#0e5fd9" stroke-width="2"/>
  <text x="384" y="242" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0e5fd9">STEP 2</text>
  <text x="384" y="268" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">Platform ODM</text>
  <text x="384" y="292" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">Existing hardware, opened up to</text>
  <text x="384" y="311" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">your systems: MQTT, API, SDK</text>
  <text x="384" y="338" font-family="IBM Plex Mono, monospace" font-size="13" fill="#0e5fd9">MOQ 500 pcs · 15–25 days</text>
  <text x="384" y="359" font-family="Instrument Sans, sans-serif" font-size="13" fill="#6a7386">50% deposit / 50% before shipment</text>
  <line x1="384" y1="380" x2="616" y2="380" stroke="#e3e7ee" stroke-width="1.5"/>
  <text x="384" y="404" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">+ integration is priced separately,</text>
  <text x="384" y="423" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">not hidden in the unit price</text>
  <text x="384" y="450" font-family="Instrument Sans, sans-serif" font-size="13" fill="#6a7386">You still sell someone else's brand</text>

  <!-- step 3 -->
  <rect x="672" y="86" width="272" height="384" rx="9" fill="#fff" stroke="#2f6b3f" stroke-width="2.5"/>
  <text x="692" y="116" font-family="IBM Plex Mono, monospace" font-size="12" fill="#2f6b3f">STEP 3</text>
  <text x="692" y="142" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0b0f1a">Full OEM / own tooling</text>
  <text x="692" y="166" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">Your logo, housing colour, retail</text>
  <text x="692" y="185" font-family="Instrument Sans, sans-serif" font-size="14" fill="#3d4453">packaging and software UI</text>
  <text x="692" y="212" font-family="IBM Plex Mono, monospace" font-size="13" fill="#2f6b3f">MOQ 2,000 pcs · 25–35 days</text>
  <text x="692" y="233" font-family="Instrument Sans, sans-serif" font-size="13" fill="#6a7386">50% deposit / 50% before shipment</text>
  <line x1="692" y1="254" x2="924" y2="254" stroke="#e3e7ee" stroke-width="1.5"/>
  <text x="692" y="278" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">2,000 pcs is not a haggling figure —</text>
  <text x="692" y="297" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">it is the threshold for a dedicated</text>
  <text x="692" y="316" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">production run rather than a stock item</text>
  <line x1="692" y1="337" x2="924" y2="337" stroke="#e3e7ee" stroke-width="1.5"/>
  <text x="692" y="361" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">Your model suffix is exclusive to you</text>
  <text x="692" y="386" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">Re-certification is <tspan font-weight="600">not</tspan> triggered if the</text>
  <text x="692" y="405" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">suffix falls inside the certificate's</text>
  <text x="692" y="424" font-family="Instrument Sans, sans-serif" font-size="13" fill="#3d4453">declared series range</text>
  <text x="692" y="452" font-family="Instrument Sans, sans-serif" font-size="13" fill="#6a7386">The certificate still names the factory</text>

  <!-- arrows -->
  <path d="M336 400 L356 400" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M644 282 L664 282" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9aa3b5"/></marker></defs>

  <text x="500" y="500" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="14.5" fill="#3d4453">Most buyers who say "we want OEM" want step 2. Step 3 is worth it only when the brand on the label is the point.</text>
</svg>
